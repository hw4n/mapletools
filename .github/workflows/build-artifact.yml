name: Build Artifact

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: build-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit

      - name: Lint application
        run: pnpm lint

      - name: Build application
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build

      - name: Collect build artifact
        run: |
          mkdir -p dist-artifacts
          cp -R .next dist-artifacts/.next
          rm -rf dist-artifacts/.next/cache
          if [ -d public ]; then
            cp -R public dist-artifacts/public
          fi
          cp package.json pnpm-lock.yaml dist-artifacts/
          shopt -s nullglob
          for config in next.config.*; do
            cp "$config" dist-artifacts/
          done
          shopt -u nullglob

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: dist-artifacts/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
